function shareUrl(){const u=new URL(location.href);u.searchParams.delete("place");if(active)u.searchParams.set("place",active.id);u.searchParams.set("layer",map.dataset.layer);return u.toString()}
document.getElementById("copyLink").onclick=async()=>{const url=shareUrl();try{await navigator.clipboard.writeText(url);notify("Lien de la carte copié")}catch{window.prompt("Copiez le lien de la carte :",url)}};
const previousSelect=select;select=function(id){previousSelect(id);syncFavorite();try{const u=new URL(location.href);u.searchParams.set("place",id);history.replaceState(null,"",u)}catch{}};
const params=new URL(location.href).searchParams;const startLayer=params.get("layer");if(["normal","satellite","relief"].includes(startLayer)){document.querySelector('[data-mode="'+startLayer+'"]').click()}const startPlace=params.get("place");if(startPlace&&places.some(p=>p.id===startPlace)){select(startPlace)}
document.addEventListener("keydown",e=>{if(e.key==="/"&&e.target.tagName!=="INPUT"){e.preventDefault();search.focus()}});
renderIcons();
</script></body></html>
