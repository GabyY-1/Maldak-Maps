:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#202124;background:#eef2f0}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #4285f4;outline-offset:2px}.app{height:100dvh;display:flex;position:relative}.map{flex:1;position:relative;overflow:hidden;background:#a8d6e8;touch-action:none}.map svg{width:100%;height:100%;display:block;user-select:none}.top{position:absolute;top:18px;left:18px;z-index:5;display:flex;gap:10px;align-items:center;max-width:calc(100% - 100px)}.searchBox{display:flex;align-items:center;gap:8px;background:white;padding:7px 9px;border-radius:13px;box-shadow:0 2px 12px #0002;width:min(410px,calc(100vw - 128px));height:54px}.brand{font-weight:800;letter-spacing:-.7px;color:#1767cf;white-space:nowrap;font-size:18px;padding:0 5px}.brand b{color:#34a853}.searchBox input{min-width:0;flex:1;border:0;background:transparent;outline:0;font-size:14px}.searchBox button{border:0;background:transparent;color:#5f6368;font-size:19px}.chip{border:1px solid #e1e4e7;border-radius:999px;background:white;color:#404449;font-size:13px;font-weight:600;padding:10px 14px;box-shadow:0 1px 6px #0001;white-space:nowrap}.chip.on{background:#e8f0fe;border-color:#aecbfa;color:#1967d2}.floating{position:absolute;z-index:5;right:18px;top:18px;display:flex;flex-direction:column;gap:12px}.controlset{display:flex;flex-direction:column;background:white;border-radius:13px;overflow:hidden;box-shadow:0 2px 12px #0002}.controlset button{height:43px;width:45px;border:0;border-bottom:1px solid #eee;background:white;color:#3c4043;font-size:22px}.controlset button:last-child{border-bottom:0}.controlset button:hover,.chip:hover{background:#edf3fa}.layers{position:absolute;right:18px;bottom:25px;z-index:5;display:flex;gap:8px;background:#fff;padding:7px;border-radius:14px;box-shadow:0 2px 12px #0002}.layers button{border:0;background:transparent;padding:9px 1 <script>
const ns="http://www.w3.org/2000/svg",map=document.getElementById("map"),svg=document.getElementById("world"),places=[
{id:"city",name:"Maldak-City",kind:"Capitale",island:"Île de Maldak",x:620,y:465,description:"Capitale de la République de Maldak, au fond d'une grande baie ouverte. Environ 3,2 millions d'habitants proposés."},
{id:"government",name:"Baie des Institutions",kind:"Quartier gouvernemental",island:"Maldak-City",x:613,y:522,description:"Quartier politique projeté : palais présidentiel, Assemblée nationale de 350 députés et institutions nationales."},
{id:"business",name:"Centre-Maldak",kind:"Centre d'affaires",island:"Maldak-City",x:643,y:409,description:"Quartier d'affaires envisagé, avec des gratte-ciel pouvant atteindre 400 mètres."},
{id:"port",name:"Port Central",kind:"Port",island:"Maldak-City",x:710,y:539,description:"Port et terminaux maritimes proposés. Position provisoire."},
{id:"north",name:"Nord-City",kind:"Arrondissement",island:"Maldak-City",x:552,y:344,description:"Grand arrondissement résidentiel proposé avec parcs et équipements de proximité."},
{id:"university",name:"Val-Maldak",kind:"Arrondissement",island:"Maldak-City",x:521,y:444,description:"Secteur universitaire et hospitalier envisagé."},
{id:"hills",name:"Hauts de Maldak",kind:"Arrondissement",island:"Maldak-City",x:736,y:324,description:"Quartiers de collines et vastes espaces naturels protégés."},
{id:"east",name:"Estuaire",kind:"Arrondissement",island:"Maldak-City",x:730,y:464,description:"Zone d'activités et de logistique projetée."},
{id:"south",name:"Rives du Sud",kind:"Arrondissement",island:"Maldak-City",x:526,y:553,description:"Secteur de littoral préservé, promenades et logements."},
{id:"valdorie",name:"Valden",kind:"Ville proposée",island:"Valdorie",x:200,y:382,description:"Pôle industriel et technologique proposé, sur l'île de Valdorie."},
{id:"azurane",name:"Port-Azur",kind:"Ville proposée",island:"Azurane",x:985,y:362,description:"Métropole maritime et commerciale proposée."},
{id:"solmera",name:"Solmera",kind:"Ville proposée",island:"Solmera",x:512,y:743,description:"Ville touristique et universitaire proposée."},
{id:"neris",name:"Néris",kind:"Île",island:"Archipel Maldak",x:635,y:75,description:"Île septentrionale de l'archipel de Maldak."}
];
function svgEl(tag,props,parent){const e=document.createElementNS(ns,tag);Object.entries(props||{}).forEach(([k,v])=>e.setAttribute(k,String(v)));parent.appendChild(e);return e;}
const small=document.getElementById("minorRoads"),edges=document.getElementById("roadEdges"),roads=document.getElementById("roads"),highways=document.getElementById("highways");
for(let x=487;x<=747;x+=23){svgEl("path",{d:`M${x} 354V592`,class:"minor"},small)}
for(let y=364;y<=589;y+=23){svgEl("path",{d:`M473 ${y}H763`,class:"minor"},small)}
const mainRoads=["M466 412Q594 399 771 426","M504 343Q596 455 717 586","M542 331Q553 453 532 580","M734 364Q679 476 743 551"];mainRoads.forEach(d=>{svgEl("path",{d,class:"roadedge"},edges);svgEl("path",{d,class:"road"},roads)});
["M378 342Q470 290 573 301Q726 254 822 327","M416 472Q492 520 592 542Q713 587 794 484","M574 198Q629 276 677 363"].forEach(d=>{svgEl("path",{d,class:"motorway"},highways);svgEl("path",{d,class:"motorwayInner"},highways)});
const mg=document.getElementById("markers");places.forEach(p=>{const g=svgEl("g",{class:"marker",tabindex:"0",role:"button","aria-label":p.name,transform:`translate(${p.x} ${p.y})`},mg);svgEl("circle",{r:7},g);let t=svgEl("text",{x:11,y:-9},g);t.textContent=p.name;g.addEventListener("click",()=>select(p.id));g.addEventListener("keydown",e=>{if(e.key==="Enter")select(p.id)})});
let active=null,view={x:0,y:0,w:1200,h:830},drag=null;function redraw(){svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`)}function zoom(factor,cx=view.x+view.w/2,cy=view.y+view.h/2){const w=Math.min(1200,Math.max(95,view.w*factor)),h=w*830/1200;view={x:cx-w/2,y:cy-h/2,w,h};redraw()}function center(x,y,level=390){view={x:x-level/2,y:y-level*830/2400,w:level,h:level*830/1200};redraw()}function reset(){view={x:0,y:0,w:1200,h:830};redraw();document.getElementById("route").style.display="none";document.getElementById("routeText").style.display="none"}
document.getElementById("zoomIn").onclick=()=>zoom(.7);document.getElementById("zoomOut").onclick=()=>zoom(1.4);document.getElementById("reset").onclick=reset;
function point(e){const r=svg.getBoundingClientRect();return{x:view.x+(e.clientX-r.left)/r.width*view.w,y:view.y+(e.clientY-r.top)/r.height*view.h}}
svg.addEventListener("pointerdown",e=>{if(e.target.closest(".marker"))return;drag={clientX:e.clientX,clientY:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener("pointermove",e=>{if(!drag)return;const r=svg.getBoundingClientRect();view.x=drag.vx-(e.clientX-drag.clientX)/r.width*view.w;view.y=drag.vy-(e.clientY-drag.clientY)/r.height*view.h;redraw()});svg.addEventListener("pointerup",()=>drag=null);svg.addEventListener("pointercancel",()=>drag=null);svg.addEventListener("wheel",e=>{e.preventDefault();const p=point(e);zoom(e.deltaY>0?1.12:.88,p.x,p.y)},{passive:false});
const panel=document.getElementById("panel");function select(id){const p=places.find(v=>v.id===id);if(!p)return;active=p;panel.classList.add("show");document.getElementById("placeTitle").textContent=p.name;document.getElementById("kind").textContent=p.kind;document.getElementById("placeIsland").textContent=p.island;document.getElementById("description").textContent=p.description;document.getElementById("routeText").style.display="none";center(p.x,p.y,460);document.getElementById("suggestions").classList.remove("show")}
document.getElementById("closePanel").onclick=()=>panel.classList.remove("show");document.getElementById("goPlace").onclick=()=>active&&center(active.x,active.y,280);
document.getElementById("routeButton").onclick=()=>{if(!active)return;const start=places[0],path=document.getElementById("route");path.setAttribute("d",`M${start.x} ${start.y}L${active.x} ${active.y}`);path.style.display="block";document.getElementById("routeText").textContent="Ligne indicative depuis Maldak-City. Ce n'est PAS un trajet routier calculé : le graphe de navigation sera développé ultérieurement.";document.getElementById("routeText").style.display="block";view={x:0,y:0,w:1200,h:830};redraw()};
const search=document.getElementById("search"),suggestions=document.getElementById("suggestions");function showMatches(){const q=search.value.trim().toLocaleLowerCase("fr");if(!q){suggestions.classList.remove("show");return}const matches=places.filter(p=>(p.name+" "+p.kind+" "+p.island).toLocaleLowerCase("fr").includes(q)).slice(0,7);suggestions.replaceChildren();matches.forEach(p=>{const b=document.createElement("button");b.textContent=p.name+" · "+p.kind;b.onclick=()=>{search.value=p.name;select(p.id)};suggestions.appendChild(b)});if(!matches.length){const b=document.createElement("button");b.textContent="Aucun lieu correspondant";b.disabled=true;suggestions.appendChild(b)}suggestions.classList.add("show")}
search.addEventListener("input",showMatches);search.addEventListener("keydown",e=>{if(e.key==="Enter"){const q=search.value.toLocaleLowerCase("fr");const p=places.find(p=>p.name.toLocaleLowerCase("fr").includes(q));if(p)select(p.id)}if(e.key==="Escape")suggestions.classList.remove("show")});document.getElementById("clearSearch").onclick=()=>{search.value="";suggestions.classList.remove("show");search.focus()};
document.getElementById("allPlaces").onclick=()=>{search.value="";suggestions.replaceChildren();places.forEach(p=>{let b=document.createElement("button");b.textContent=p.name+" · "+p.kind;b.onclick=()=>select(p.id);suggestions.appendChild(b)});suggestions.classList.toggle("show")};
const notes={normal:"Plan vectoriel fictif · routes et bâtiments encore conceptuels",satellite:"Satellite fictif stylisé · aucune véritable image satellite n'existe pour M7B3",relief:"Relief stylisé · altitudes et courbes de niveau non mesurées"};document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(n=>n.classList.remove("active"));b.classList.add("active");map.dataset.layer=b.dataset.mode;document.getElementById("layerNote").textContent=notes[b.dataset.mode]});
window.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="+")zoom(.8);if(e.key==="-")zoom(1.2);if(e.key==="Escape")panel.classList.remove("show")});
</script></body></html>
